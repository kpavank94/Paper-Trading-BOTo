name: Android APK

# Manual only. Produces a generic debug APK that contains no backend address:
# workflow inputs and artifacts are world-readable on a public repository, so
# baking in a private tailnet URL would publish it. The app asks for the backend
# address on first launch and stores it on the device.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        # --ignore-scripts matches the migration gate recorded in BOTo_MIGRATION.md.
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Install wrapper dependencies
        run: npm ci --ignore-scripts
        working-directory: android-app

      - name: Test the API-base shim
        run: npm test
        working-directory: android-app

      - name: Build web assets and sync Capacitor
        # BOTO_API_BASE intentionally unset — see the note at the top of this file.
        run: npm run sync
        working-directory: android-app

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app/android

      - name: Verify the APK carries no baked-in backend address
        # Guards against a future change reintroducing a private URL into a
        # world-readable artifact. The setup screen's placeholder is the one
        # expected tailnet-shaped string, so it is excluded by name.
        run: |
          found=$(grep -aoE 'https?://[a-z0-9-]+\.[a-z0-9-]+\.ts\.net' \
                    android/app/build/outputs/apk/debug/app-debug.apk \
                  | grep -v 'your-host\.your-tailnet\.ts\.net' | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::APK contains a tailnet URL — it must ship unconfigured"
            echo "$found"
            exit 1
          fi
          echo "APK is clean"
        working-directory: android-app

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: boto-trading-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
