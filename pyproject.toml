[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-trading-boto"
version = "0.2.0"
description = "Event-driven paper trading bot: backtest with simulated broker, trade live-paper via IBKR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # ib_insync is archived (last release 0.9.86); ib_async is the maintained,
    # API-compatible successor fork.
    "ib_async>=1.0.1",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "tabulate>=0.9",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
    "pydantic>=2.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
boto = "paper_trading_boto.cli:main"

[tool.setuptools.packages.find]
include = ["paper_trading_boto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
